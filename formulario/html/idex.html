<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Testando Formulário</h1>
    <form action="" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados pessoais</legend>
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" placeholder="Seu nome">
                
                <span id="erroNome" style="color: red"></span>
            </p>

            <p>
                <label for="iemail">E-mail</label>
                <input type="email" name="email" id="iemail" autocomplete="email"placeholder=".......@gemail">

                <span id="erroEmail" style="color: red"></span>
            </p>
        
            <p>
                <label for="msg">Mensagem</label>
                <textarea name="msg" id="imsg" placeholder="Sua mensagem"></textarea>

                <span id="erroMsg" style="color: red"></span>
            </p>

            <p id="sucesso" style="color: green"></p>
        </fieldset>
        
        <p>
            <button type="button" onclick ="validar()">Enviar</button>
            <input type="reset" value="Limpar">
        </p>

    </form>
    <script src="script/1.js"></script>
</body>
</html>
