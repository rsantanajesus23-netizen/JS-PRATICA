<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Minha Loja de Sapatos</title>
</head>
<body>

    <header id="cabecalho">
        <h1>👟 Minha Loja</h1>
        <nav id="nav-usuario">
            <button id="botao-meus-pedidos" hidden>Meus Pedidos</button>
            <button id="botao-sair" hidden>Sair</button>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        </nav>
    </header>

    <main>

        <!-- Login e Cadastro -->
        <section id="area-auth">
            <form id="form-login">
                <h2>Entrar</h2>
                <div class="form-loja">
                    <label for="email-login">Email</label>
                    <input type="email" id="email-login" required>
                </div>
                <div class="form-loja">
                    <label for="senha-login">Senha</label>
                    <input type="password" id="senha-login" required>
                    <button type="button" id="toggle-senha-login"><i class="fa fa-eye"></i></button>
                </div>
                <button type="submit">Entrar</button>
                <p id="mensagem-login"></p>
            </form>

            <form id="form-cadastro">
                <h2>Criar conta</h2>
                <div class="campo-form">
                    <label for="nome-cadastro">Nome</label>
                    <input type="text" id="nome-cadastro" required>
                </div>
                <div class="campo-form">
                    <label for="email-cadastro">Email</label>
                    <input type="email" id="email-cadastro" required>
                </div>
                <div class="campo-form">
                    <label for="senha-cadastro">Senha</label>
                    <input type="password" id="senha-cadastro" minlength="6" required>
                    <button type="button" id="toggle-senha-cadastro"><i class="fa fa-eye"></i></button>
                </div>
                <button type="submit">Criar conta</button>
                <p id="mensagem-cadastro"></p>
            </form>
        </section>

        <!-- Histórico de pedidos -->
        <div id="area-pedidos" hidden></div>

        <!-- Formulário de cadastro de produto (só dono) -->
        <form id="form-produto" hidden>
            <h2>Cadastrar Produto</h2>
            <label for="nome-produto">Nome</label>
            <input type="text" name="nome" id="nome-produto" required>

            <label for="preco-produto">Preço</label>
            <input type="number" name="preco" id="preco-produto" step="0.01" min="0" required>

            <button type="submit">Cadastrar Produto</button>
            <p id="mensagem-produto"></p>
        </form>

        <!-- Produtos e Carrinho lado a lado -->
        <div id="area-loja">

            <section id="area-produtos">
                <h2>Produtos</h2>
                <ul id="lista-produtos"></ul>
            </section>

            <section id="area-carrinho">
                <h2>Carrinho</h2>
                <ul id="lista-carrinho"></ul>
                <p id="total-carrinho"></p>
                <button id="botao-finalizar" type="button">Finalizar pedido</button>
                <p id="mensagem-carrinho"></p>
            </section>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
